name: Upstream sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require internal/main as default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != "internal/main" ]; then
            echo "::error::Repository default branch must be internal/main (found $DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Require sync app credentials
        env:
          APP_ID: ${{ secrets.ZGE_PASEO_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ZGE_PASEO_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::ZGE_PASEO_SYNC_APP_ID and ZGE_PASEO_SYNC_APP_PRIVATE_KEY secrets are required."
            exit 1
          fi

      - name: Mint sync app installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ZGE_PASEO_SYNC_APP_ID }}
          private-key: ${{ secrets.ZGE_PASEO_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Fetch upstream main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Fast-forward fork main
        id: fast-forward
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch upstream main
          fork_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            title="Upstream sync blocked: fork main diverged"
            body="$(cat <<EOF
          <!-- upstream-sync-divergence -->
          ## Upstream sync blocked

          Fork \`main\` is not an ancestor of upstream \`main\`, so the mirror was not changed.

          - Fork \`main\` SHA: $fork_sha
          - Upstream \`main\` SHA: $upstream_sha

          ## Recovery

          Have a maintainer inspect the divergence, remove fork-only commits from \`main\`, and restore it as an exact upstream mirror. Re-run **Upstream sync** only after \`main\` is an ancestor of upstream \`main\`; import fork-only work through \`internal/main\` instead.
          EOF
          )"
            number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "$title" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
            echo "::error::Upstream sync blocked: fork main $fork_sha diverged from upstream main $upstream_sha. See the actionable incident issue for recovery instructions."
            echo "fast_forward=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push origin "$upstream_sha":main
          git fetch origin internal/main
          if [ "$(git rev-list --count origin/internal/main..$upstream_sha)" -eq 0 ]; then
            echo "No commits in main are absent from internal/main."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync_needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "fast_forward=true" >> "$GITHUB_OUTPUT"

      - name: Classify merge-tree
        id: classify
        if: steps.fast-forward.outputs.fast_forward == 'true' && steps.fast-forward.outputs.sync_needed == 'true'
        run: |
          set -euo pipefail
          set +e
          git merge-tree --write-tree origin/internal/main origin/main >"$RUNNER_TEMP/merge-tree.out" 2>"$RUNNER_TEMP/merge-tree.err"
          set -e
          conflicts="$(
            { grep 'Merge conflict in ' "$RUNNER_TEMP/merge-tree.out" "$RUNNER_TEMP/merge-tree.err" || true; } |
              sed 's/.*Merge conflict in //' | sort -u
          )"
          if [ -z "$conflicts" ]; then
            echo "class=clean" >> "$GITHUB_OUTPUT"
            echo "No merge conflicts."
            exit 0
          fi
          {
            echo "conflicts<<EOF"
            printf '%s\n' "$conflicts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          extra="$(printf '%s\n' "$conflicts" | grep -vE '^(nix/npm-deps\.hash|package-lock\.json)$' || true)"
          if [ -z "$extra" ]; then
            echo "class=derived" >> "$GITHUB_OUTPUT"
            echo "Derived-file conflicts:"
            printf '%s\n' "$conflicts"
          else
            echo "class=blocked" >> "$GITHUB_OUTPUT"
            echo "Non-derived conflicts:"
            printf '%s\n' "$conflicts"
          fi

      - name: Open or update sync pull request
        if: >-
          steps.classify.outputs.class == 'clean' ||
          steps.classify.outputs.class == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLASS: ${{ steps.classify.outputs.class }}
          CONFLICTS: ${{ steps.classify.outputs.conflicts }}
        run: |
          set -euo pipefail
          # PATCH can 422 right after a push moves the pull request head while
          # GitHub reprocesses the synchronize event; retry with backoff.
          patch_pull_request() {
            local number="$1"
            shift
            local attempt=1
            until gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" "$@" >/dev/null; do
              if [ "$attempt" -ge 5 ]; then
                return 1
              fi
              echo "PATCH attempt $attempt failed; retrying in $((attempt * 5))s."
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }
          title="Sync upstream main into internal/main"
          body="Automated upstream sync from main into internal/main."
          number="$(gh pr list --base internal/main --head main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            patch_pull_request "$number" -f title="$title" -f body="$body"
          else
            number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head=main -f base=internal/main -f body="$body" --jq '.number')"
          fi
          if [ "$CLASS" = "blocked" ]; then
            blocked_body="$(cat <<EOF
          Sync cannot auto-resolve. Unmerged paths:

          \`\`\`
          $CONFLICTS
          \`\`\`

          Do not resolve this pull request in the GitHub web editor. Branch from \`internal/main\`, merge \`main\`, and open a \`Downstream sync: true\` pull request.
          EOF
          )"
            patch_pull_request "$number" -f body="$blocked_body"
          fi

      - uses: actions/setup-node@v4
        if: steps.classify.outputs.class == 'derived'
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        if: steps.classify.outputs.class == 'derived'
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Resolve derived conflicts
        id: resolve
        if: steps.classify.outputs.class == 'derived'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # PATCH can 422 right after the sync/downstream force-push moves the
          # pull request head (synchronize reprocessing); retry with backoff.
          patch_pull_request() {
            local number="$1"
            shift
            local attempt=1
            until gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" "$@" >/dev/null; do
              if [ "$attempt" -ge 5 ]; then
                return 1
              fi
              echo "PATCH attempt $attempt failed; retrying in $((attempt * 5))s."
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          git fetch origin main internal/main
          TRUSTED_SCRIPTS="$GITHUB_WORKSPACE/.trusted-sync-scripts"
          rm -rf "$TRUSTED_SCRIPTS"
          mkdir -p "$TRUSTED_SCRIPTS"
          git show origin/internal/main:scripts/check-upstream-provenance.mjs >"$TRUSTED_SCRIPTS/check-upstream-provenance.mjs"
          git show origin/internal/main:scripts/update-nix.sh >"$TRUSTED_SCRIPTS/update-nix.sh"
          git show origin/internal/main:scripts/fix-lockfile.mjs >"$TRUSTED_SCRIPTS/fix-lockfile.mjs"
          chmod +x "$TRUSTED_SCRIPTS/update-nix.sh"
          git checkout -B sync/downstream origin/internal/main
          git config user.name "zge-paseo-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U | sort -u)"
            extra="$(printf '%s\n' "$unmerged" | grep -vE '^(nix/npm-deps\.hash|package-lock\.json)$' || true)"
            if [ -n "$extra" ]; then
              echo "Unexpected unmerged paths after classify:"
              printf '%s\n' "$unmerged"
              git merge --abort
              exit 0
            fi
            if printf '%s\n' "$unmerged" | grep -qx 'package-lock.json'; then
              git show :1:package-lock.json >"$RUNNER_TEMP/lock-base.json"
              git show :2:package-lock.json >"$RUNNER_TEMP/lock-ours.json"
              git show :3:package-lock.json >"$RUNNER_TEMP/lock-theirs.json"
              if ! env -u GH_TOKEN -u GITHUB_TOKEN node "$TRUSTED_SCRIPTS/check-upstream-provenance.mjs" \
                --merge-lockfile \
                --base "$RUNNER_TEMP/lock-base.json" \
                --ours "$RUNNER_TEMP/lock-ours.json" \
                --theirs "$RUNNER_TEMP/lock-theirs.json" \
                --out package-lock.json; then
                echo "package-lock.json was not signature-only."
                git merge --abort
                exit 0
              fi
              git add package-lock.json
            fi
          fi

          if ! env -u GH_TOKEN -u GITHUB_TOKEN "$TRUSTED_SCRIPTS/update-nix.sh"; then
            echo "update-nix.sh failed."
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort
            fi
            exit 0
          fi
          git add nix/npm-deps.hash package-lock.json
          leftover="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$leftover" ]; then
            echo "Unmerged paths remain:"
            printf '%s\n' "$leftover"
            git merge --abort
            exit 0
          fi
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          if ! env -u GH_TOKEN -u GITHUB_TOKEN "$TRUSTED_SCRIPTS/update-nix.sh" --check; then
            echo "update-nix.sh --check failed after commit."
            exit 0
          fi
          git push --force origin sync/downstream

          title="Sync main into internal/main"
          body="Downstream sync: true"
          number="$(gh pr list --base internal/main --head sync/downstream --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            patch_pull_request "$number" -f title="$title" -f body="$body"
          else
            number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head=sync/downstream -f base=internal/main -f body="$body" --jq '.number')"
          fi

          main_pr="$(gh pr list --base internal/main --head main --state open --json number --jq '.[0].number')"
          if [ -n "$main_pr" ]; then
            gh pr close "$main_pr" --comment "Superseded by derived-file resolution in #$number. Do not merge the \`main\` head pull request."
          fi
          echo "resolved=true" >> "$GITHUB_OUTPUT"

      - name: Open blocked pull request after failed resolve
        if: steps.classify.outputs.class == 'derived' && steps.resolve.outputs.resolved == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFLICTS: ${{ steps.classify.outputs.conflicts }}
        run: |
          set -euo pipefail
          patch_pull_request() {
            local number="$1"
            shift
            local attempt=1
            until gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" "$@" >/dev/null; do
              if [ "$attempt" -ge 5 ]; then
                return 1
              fi
              echo "PATCH attempt $attempt failed; retrying in $((attempt * 5))s."
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }
          title="Sync upstream main into internal/main"
          body="Automated upstream sync from main into internal/main."
          number="$(gh pr list --base internal/main --head main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            patch_pull_request "$number" -f title="$title" -f body="$body"
          else
            number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head=main -f base=internal/main -f body="$body" --jq '.number')"
          fi
          blocked_body="$(cat <<EOF
          Derived-file auto-resolve failed. Unmerged paths from merge-tree:

          \`\`\`
          $CONFLICTS
          \`\`\`

          Do not resolve this pull request in the GitHub web editor. Branch from \`internal/main\`, merge \`main\`, and open a \`Downstream sync: true\` pull request.
          EOF
          )"
          patch_pull_request "$number" -f body="$blocked_body"
