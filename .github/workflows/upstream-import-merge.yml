name: Upstream import merge

on:
  pull_request_target:
    branches: [internal/main]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.base.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'internal/main' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref != 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Select pull request
        id: pull-request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            number="$INPUT_NUMBER"
          else
            number="$EVENT_NUMBER"
          fi
          case "$number" in
            ''|*[!0-9]*) echo "::error::Pull request must be a positive number"; exit 1 ;;
          esac
          if [ "$number" -lt 1 ]; then
            echo "::error::Pull request must be a positive number"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-upstream-provenance.mjs

      - name: Detect upstream import metadata
        id: import
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$PULL_REQUEST" --repo "$REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pull-request-body"
          if node --input-type=module - "$RUNNER_TEMP/pull-request-body" <<'NODE'
          import { readFileSync } from "node:fs";
          const body = readFileSync(process.argv[2], "utf8");
          process.exit(/^Upstream issue\s*:/im.test(body) ? 0 : 1);
          NODE
          then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI checks
        if: steps.import.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail
          while :; do
            set +e
            checks="$(gh pr checks "$PULL_REQUEST" --repo "$REPOSITORY" --json name,workflow,state 2>"$RUNNER_TEMP/checks-error")"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              cat "$RUNNER_TEMP/checks-error" >&2
              exit "$status"
            fi
            result="$(node --input-type=module - "$checks" <<'NODE'
          const checks = JSON.parse(process.argv[2]);
          const ciChecks = checks.filter((candidate) => candidate.workflow === "CI");
          const failed = [];
          const pending = [];
          const terminalSuccess = new Set(["SUCCESS", "SKIPPED"]);
          const waiting = new Set(["PENDING", "EXPECTED", "QUEUED", "IN_PROGRESS"]);

          if (ciChecks.length === 0) pending.push("CI");
          for (const check of ciChecks) {
            const state = typeof check.state === "string" ? check.state.toUpperCase() : "";
            const label = `CI / ${check.name ?? "<unnamed>"}`;
            if (waiting.has(state)) {
              pending.push(`${label}: ${state}`);
            } else if (!terminalSuccess.has(state)) {
              failed.push(`${label}: ${state || "ABSENT"}`);
            }
          }
          if (failed.length) {
            console.error(`CI check failed: ${failed.join(", ")}`);
            process.stdout.write("failed");
          } else if (pending.length) {
            process.stdout.write("pending");
          } else {
            process.stdout.write("passed");
          }
          NODE
            )"
            case "$result" in
              passed) break ;;
              failed) exit 1 ;;
              pending) sleep 10 ;;
              *) echo "::error::Unexpected CI check state: $result"; exit 1 ;;
            esac
          done

      - name: Revalidate provenance immediately before merge
        if: steps.import.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail
          node scripts/check-upstream-provenance.mjs \
            --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" \
            --evidence "$RUNNER_TEMP/reconciliation-evidence.json"

      - name: Merge validated import
        if: steps.import.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail
          mode="$(node --input-type=module - "$RUNNER_TEMP/reconciliation-evidence.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const evidence = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.stdout.write(evidence.mode);
          NODE
          )"
          if [ "$mode" != "direct" ] && [ "$mode" != "reconciled" ]; then
            echo "::error::Unknown upstream import mode: $mode"
            exit 1
          fi

          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          gh api graphql --paginate --slurp \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PULL_REQUEST" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    headRefOid
                    latestReviews(first: 100, after: $endCursor) {
                      nodes {
                        author {
                          __typename
                          ... on User { login }
                        }
                        state
                        commit { oid }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            ' > "$RUNNER_TEMP/pull-request-reviews.json"

          approved_head="$(node --input-type=module - "$RUNNER_TEMP/pull-request-reviews.json" "$mode" <<'NODE'
          import { readFileSync } from "node:fs";
          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const mode = process.argv[3];
          if (!Array.isArray(pages) || pages.length === 0) {
            throw new Error("GraphQL review query returned no pages");
          }
          const pullRequests = pages.map((page) => page?.data?.repository?.pullRequest);
          if (pullRequests.some((pullRequest) => !pullRequest)) {
            throw new Error("GraphQL review query returned no pull request");
          }
          const headRefOids = new Set(pullRequests.map((pullRequest) => pullRequest.headRefOid));
          if (headRefOids.size !== 1 || [...headRefOids][0] === null) {
            throw new Error("Pull request head changed while reviews were paged");
          }
          const headRefOid = [...headRefOids][0];
          const hasCurrentHeadHumanApproval = pullRequests.some((pullRequest) =>
            pullRequest.latestReviews.nodes.some((review) =>
              review.state === "APPROVED" &&
              review.author?.__typename === "User" &&
              review.commit?.oid === headRefOid
            )
          );
          if (mode === "reconciled" && !hasCurrentHeadHumanApproval) {
            process.stdout.write("NO_APPROVAL");
          } else {
            process.stdout.write(headRefOid);
          }
          NODE
          )"
          if [ "$mode" = "reconciled" ] && [ "$approved_head" = "NO_APPROVAL" ]; then
            echo "Reconciled import remains open until one human approval is recorded for the current pull request head."
            exit 0
          fi
          echo "head_oid=$approved_head" >> "$GITHUB_OUTPUT"
          gh pr merge "$PULL_REQUEST" --repo "$REPOSITORY" --merge --delete-branch=false --match-head-commit "$approved_head"
